spring.application.name=chatop

# Same port as Mockoon: the Angular proxy forwards /api to http://localhost:3001
server.port=3001

# Database: credentials are read from environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is created by the SQL script: Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: signing secret from an environment variable, token lifetime in seconds
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# Rental pictures: saved in a local folder and served under /images/**
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads
app.images-base-url=http://localhost:3001/images/

# Swagger UI: http://localhost:3001/swagger-ui/index.html (set both to false to hide the documentation)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Each route documents its own error codes instead of every handler of GlobalExceptionHandler
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
